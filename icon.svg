<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#a259ff"/>
    </linearGradient>
    <linearGradient id="hand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#a0b4d6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle grid dots -->
  <g opacity="0.07" fill="#ffffff">
    <circle cx="200" cy="200" r="5"/><circle cx="300" cy="200" r="5"/><circle cx="400" cy="200" r="5"/>
    <circle cx="500" cy="200" r="5"/><circle cx="600" cy="200" r="5"/><circle cx="700" cy="200" r="5"/>
    <circle cx="800" cy="200" r="5"/>
    <circle cx="200" cy="300" r="5"/><circle cx="800" cy="300" r="5"/>
    <circle cx="200" cy="400" r="5"/><circle cx="800" cy="400" r="5"/>
    <circle cx="200" cy="500" r="5"/><circle cx="800" cy="500" r="5"/>
    <circle cx="200" cy="600" r="5"/><circle cx="800" cy="600" r="5"/>
    <circle cx="200" cy="700" r="5"/><circle cx="800" cy="700" r="5"/>
    <circle cx="200" cy="800" r="5"/><circle cx="300" cy="800" r="5"/><circle cx="400" cy="800" r="5"/>
    <circle cx="500" cy="800" r="5"/><circle cx="600" cy="800" r="5"/><circle cx="700" cy="800" r="5"/>
    <circle cx="800" cy="800" r="5"/>
  </g>

  <!-- Outer gradient ring -->
  <circle cx="512" cy="490" r="310" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.9" filter="url(#glow)"/>

  <!-- Clock face -->
  <circle cx="512" cy="490" r="268" fill="#0f1729" opacity="0.95"/>

  <!-- Hour tick marks -->
  <g stroke="#4f8ef7" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <!-- 12 -->
    <line x1="512" y1="242" x2="512" y2="272"/>
    <!-- 3 -->
    <line x1="760" y1="490" x2="730" y2="490"/>
    <!-- 6 -->
    <line x1="512" y1="738" x2="512" y2="708"/>
    <!-- 9 -->
    <line x1="264" y1="490" x2="294" y2="490"/>
    <!-- 1 -->
    <line x1="636" y1="254" x2="621" y2="280"/>
    <!-- 2 -->
    <line x1="726" y1="364" x2="700" y2="379"/>
    <!-- 4 -->
    <line x1="748" y1="614" x2="722" y2="599"/>
    <!-- 5 -->
    <line x1="636" y1="726" x2="621" y2="700"/>
    <!-- 7 -->
    <line x1="388" y1="726" x2="403" y2="700"/>
    <!-- 8 -->
    <line x1="276" y1="614" x2="302" y2="599"/>
    <!-- 10 -->
    <line x1="298" y1="364" x2="324" y2="379"/>
    <!-- 11 -->
    <line x1="388" y1="254" x2="403" y2="280"/>
  </g>

  <!-- Minute hand -->
  <line x1="512" y1="490" x2="512" y2="290"
        stroke="url(#hand)" stroke-width="14" stroke-linecap="round" filter="url(#softglow)"/>

  <!-- Hour hand (pointing ~4 o'clock) -->
  <line x1="512" y1="490" x2="648" y2="592"
        stroke="url(#hand)" stroke-width="20" stroke-linecap="round" filter="url(#softglow)"/>

  <!-- Center dot -->
  <circle cx="512" cy="490" r="18" fill="url(#ring)" filter="url(#glow)"/>
  <circle cx="512" cy="490" r="8" fill="#ffffff"/>

  <!-- Terminal prompt line at bottom — "$ cron" -->
  <rect x="162" y="760" width="700" height="72" rx="14" fill="#0a0f1e" opacity="0.85"/>
  <text x="198" y="808" font-family="'SF Mono', 'Menlo', 'Courier New', monospace" font-size="42" fill="#4f8ef7" font-weight="bold">$</text>
  <text x="248" y="808" font-family="'SF Mono', 'Menlo', 'Courier New', monospace" font-size="42" fill="#a259ff" font-weight="bold"> cron</text>
  <text x="418" y="808" font-family="'SF Mono', 'Menlo', 'Courier New', monospace" font-size="42" fill="#50fa7b"> --status</text>
  <!-- blinking cursor -->
  <rect x="726" y="776" width="22" height="38" rx="3" fill="#4f8ef7" opacity="0.85"/>
</svg>
